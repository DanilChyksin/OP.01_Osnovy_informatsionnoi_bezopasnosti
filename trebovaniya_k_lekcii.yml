title: "Универсальные требования к лекциям и практическим работам"
version: "2.0"

scope:
  - "Применяются к любой дисциплине, теме и номеру занятия"
  - "Содержание определяется рабочей программой и уровнем подготовки аудитории"
  - "Название дисциплины, тему и результаты обучения указывают в конкретном материале, а не закрепляют в этом файле"

general:
  format: "Markdown с корректным отображением на GitHub"
  language: "Русский, ясный научно-учебный стиль"
  audience: "Преподаватель и студенты"
  max_words: 6000
  minimum_words: null
  word_count_scope: "Весь видимый текст одной лекции, включая таблицы, подписи, вопросы, глоссарий и литературу; без URL и служебной разметки"
  volume_rule: "6000 слов — верхний предел, а не целевой объём; не увеличивать текст ради количества слов"
  duration: "Ориентир занятия — 90 минут, включая объяснение, разбор иллюстраций, обсуждение и самопроверку; фактический хронометраж проверяется преподавателем"
  timing_rule: "Не обещать ровно 90 минут непрерывного чтения; объём текста и продолжительность занятия оцениваются отдельно"

content:
  - "Оставлять только понятия, связи, модели, ограничения и выводы, необходимые для результатов обучения"
  - "Давать точные определения при первом упоминании термина; ключевые определения выделять жирным"
  - "Объяснять сложные понятия поэтапно, от основания к следствию"
  - "Различать факт, предположение, пример и вывод; обозначать границы применимости модели"
  - "Удалять повторные объяснения, длинные вступления, риторические отступления и общие фразы без новой информации"
  - "Исторические сведения включать только тогда, когда они помогают понять основную идею"
  - "Использовать короткие содержательные примеры; пошаговые упражнения оформлять отдельными практическими работами"
  - "Связывать теорию с решениями и типичными ошибками специалиста соответствующего профиля"

structure:
  - block: "Паспорт лекции"
    content: "Номер, тема, дисциплина, цель и проверяемые результаты обучения"
  - block: "Краткое введение"
    content: "Задача темы, необходимые предварительные знания и план"
  - block: "Основная часть"
    content: "3–5 смысловых разделов; определения, причинные связи, необходимые модели, иллюстрации и ограничения"
  - block: "Выводы разделов"
    content: "Короткое резюме важных положений без повторного пересказа раздела"
  - block: "Заключение"
    content: "Ключевые результаты и конкретная связь со следующей темой или практической работой"
  - block: "Самопроверка"
    content: "5–10 вопросов на объяснение, сравнение и применение, а не только воспроизведение определения"
  - block: "Глоссарий и литература"
    content: "Краткие определения основных терминов и проверяемый список источников"

teacher_text:
  - "Лекция пригодна для объяснения преподавателем и самостоятельного изучения"
  - "Методические пометки краткие и конкретные: что показать, обсудить или сопоставить"
  - "Временные ориентиры при необходимости учитывают объём разделов и обсуждение; их сумма согласована с продолжительностью занятия"

illustrations:
  purpose: "Объяснять устройство, процесс, взаимосвязь, сравнение или существенный пример; декоративные картинки не добавлять"
  formats:
    diagrams: "Компактный SVG без скриптов, внешних шрифтов и зависимостей"
    photographs: "Оптимизированный JPEG или WebP"
    screenshots: "Обрезанный до существенной области PNG или WebP с читаемым текстом"
  storage: "Хранить изображения в репозитории рядом с материалом либо в общей папке images"
  embedding: "Вставлять средствами Markdown по относительному пути; пути с пробелами корректно кодировать"
  accessibility: "Добавлять содержательный alt-текст и подпись; обеспечивать контраст, читаемые надписи и понятность без различения цветов"
  compression: "Удалять лишние метаданные, уменьшать размеры до необходимых, выбирать сжатие без потери учебной читаемости"
  target_file_size_kb: 150
  size_rule: "150 КБ на изображение — ориентир; превышение оправдывается читаемостью и содержанием, а не исходным размером файла"
  attribution: "Для внешних изображений указывать источник, автора и лицензию или основание использования; не выдумывать права и атрибуцию"
  verification: "Проверять существование файлов, корректность ссылок, отсутствие обрезанных подписей и отображение в GitHub"

practical_work:
  format: "Отдельный Markdown-файл; исходные данные приложены или содержатся непосредственно в задании"
  focus: "Рабочая задача специалиста соответствующего профиля, требующая анализа, выбора и обоснования решения"
  required_parts:
    - "Роль исполнителя, ситуация и измеримая цель"
    - "Связь с темой и рабочей программой"
    - "Достаточные исходные данные: документы, таблицы, журналы, схемы или безопасный учебный набор"
    - "Понятные ограничения, необходимые инструменты и условия выполнения"
    - "Последовательность задач с самостоятельными решениями; не только копирование действий из инструкции"
    - "Конкретные сдаваемые артефакты: отчёт, таблица, схема, обоснованный план или другой проверяемый результат"
    - "Критерии оценивания, соответствующие результатам и данным задания"
    - "Вопросы для защиты решения и дополнительное усложнение при необходимости"
  teacher_key: "Отдельный ключ преподавателя: разбор приложенных данных, допустимые варианты решений, типичные ошибки и основания оценивания"
  realism: "Использовать правдоподобные данные, неоднозначности и ограничения; обозначать синтетические наборы"
  safety: "Не требовать реальных персональных данных, чужих учётных записей или действий без разрешения; использовать учебную среду"
  accessibility: "Не требовать платных сервисов, недоступных материалов или установки избыточных инструментов без учебной необходимости"

sources:
  minimum: 5
  recommended: "5–10 релевантных источников без формального увеличения списка"
  allowed_types:
    - "Авторитетные учебники и монографии"
    - "Рецензируемые научные публикации и первоисточники"
    - "Официальные стандарты, нормативные документы и документация по предмету"
    - "Авторитетные энциклопедии и справочники"
  forbidden_types:
    - "Анонимные пересказы и непроверяемые материалы"
    - "Форумы и случайные блоги как основание ключевых утверждений"
    - "Несуществующие публикации, ссылки, цитаты и номера страниц"
  rules:
    - "Проверять существование, релевантность и применимость источника"
    - "Для изменяющихся фактов проверять актуальность и явно указывать существенную дату или редакцию"
    - "Приводить отсылки к источникам в тексте; страницы указывать только после сверки конкретного издания"
    - "Оформлять список по ГОСТ Р 7.0.100-2018 с достоверными библиографическими сведениями"
    - "Прямые цитаты отделять от пересказа, указывать авторство и соблюдать права использования"
    - "Для электронных источников указывать прямую ссылку и фактическую дату обращения"

formatting:
  - "Использовать последовательные нумерованные разделы и подразделы"
  - "Формулы, таблицы и рисунки снабжать понятными обозначениями и подписями"
  - "Проверять таблицы, кодовые блоки, формулы, изображения и ссылки в GitHub"
  - "Не полагаться на HTML или расширения, которые не поддерживаются в GitHub Markdown"
  - "Markdown не фиксирует шрифт и интервал; параметры печати задаются отдельно при экспорте"
  - "Текст материала не содержит служебных комментариев о процессе его подготовки"

checklist:
  - "Каждая лекция содержит не более 6000 слов по указанным правилам подсчёта"
  - "Все разделы работают на результаты обучения; нет заглушек, повторного наполнения и длинных общих рассуждений"
  - "Определения, модели, примеры и ограничения изложены точно и последовательно"
  - "Есть самопроверка, краткий глоссарий и минимум 5 релевантных проверяемых источников"
  - "Иллюстрации содержательны, оптимизированы, читаемы и доступны по относительным ссылкам в GitHub"
  - "Практические работы обеспечены данными и требуют профессионального анализа с проверяемым результатом"
  - "Критерии и ключ преподавателя согласованы с конкретными исходными данными"
  - "Все локальные ссылки и файлы проверены; хронометраж не выдаётся за измеренный без контрольного проведения"
