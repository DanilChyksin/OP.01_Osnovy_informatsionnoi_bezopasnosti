<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img"><title>Схема 22: Продукт: сертификат → Деятельность: лицензия → Объект: аттестация → Проверка применимости</title><rect width="960" height="250" rx="16" fill="#f1f5f9"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Ключевые связи темы</text><rect x="24" y="80" width="208" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="128" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Продукт: сертификат</text><rect x="260" y="80" width="208" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="364" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Деятельность:</text><text x="364" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">лицензия</text><rect x="496" y="80" width="208" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Объект: аттестация</text><rect x="732" y="80" width="208" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="836" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">Проверка</text><text x="836" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0f172a">применимости</text></svg>